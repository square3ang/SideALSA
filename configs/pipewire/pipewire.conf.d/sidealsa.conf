# Drop into pipewire.conf.d after installing the ALSA PCM config.
# The PipeWire process must inherit ALSA_CONFIG_PATH or the named PCMs must be
# installed in the normal ALSA configuration search path.

context.objects = [
    { factory = adapter
        args = {
            factory.name         = api.alsa.pcm.sink
            node.name            = "sidealsa-line1"
            node.description     = "SideALSA Line 1"
            media.class          = "Audio/Sink"
            api.alsa.path        = "sidealsa_line1"
            api.alsa.headroom    = 0
            api.alsa.disable-mmap = true
            api.alsa.disable-batch = true
            audio.channels       = 2
            audio.position       = [ FL FR ]
            node.suspend-on-idle = true
        }
