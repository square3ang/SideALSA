[package]
name = "sidealsa-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
autobins = false

[[bin]]
name = "sidealsa-shared-test"
path = "src/bin/sidealsa-shared-test.rs"

[[bin]]
name = "sidealsa-pro-client-test"
path = "src/bin/sidealsa-pro-client-test.rs"

[[bin]]
name = "sidealsa-loopback-test"
path = "src/bin/sidealsa-loopback-test.rs"

[[bin]]
name = "sidealsa-stats"
path = "src/bin/sidealsa-stats.rs"

[dependencies]
alsa = "0.11"
sidealsa-config = { path = "../sidealsa-config" }
toml_edit = "0.23"
libc = "0.2"
serde_json = "1"
sidealsa-client = { path = "../sidealsa-client" }
sidealsa-protocol = { path = "../sidealsa-protocol" }

[[bin]]
name = "sidealsa-setup"
path = "src/bin/sidealsa-setup.rs"

[[bin]]
name = "sidealsa-reconnect"
path = "src/bin/sidealsa-reconnect.rs"
