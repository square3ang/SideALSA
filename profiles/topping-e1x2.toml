[device]
name = "Topping E1x2 OTG"
rate = 48000
period_size = 64
hardware_period_size = 64
# Capacity is B256; direct linked startup queues two Q64 periods.
buffer_size = 256
playback_queue_periods = 2
shared_buffer_size = 512
# PRO follows the physical ALSA period instead of a userspace timer.
playback_timer_scheduling = false
duplex_link = true
pro_latency_periods = 0
# Bound client handoff while retaining time for fallback and the ALSA write.
pro_handoff_us = 1000
# Keep userspace audio below the PREEMPT_RT xHCI IRQ thread (FIFO 50 here).
pro_realtime_priority = 46
shared_latency_periods = 7
shared_playback_repeat_on_underrun = true
realtime = true
realtime_priority = 48

[device.playback]
device = "hw:OTG,0"
channels = 8
format = "S32_LE"

[device.capture]
device = "hw:OTG,0"
channels = 10
format = "S32_LE"

[[ports.playback]]
id = "line1"
name = "Line 1"
channels = [0, 1]

[[ports.playback]]
id = "line2"
name = "Line 2"
channels = [2, 3]

[[ports.playback]]
id = "line3"
name = "Line 3"
channels = [4, 5]

[[ports.playback]]
id = "line4"
name = "Line 4"
channels = [6, 7]

[[ports.capture]]
id = "mic1"
name = "Mic 1"
channels = [0]

[[ports.capture]]
id = "mic2"
name = "Mic 2"
channels = [1]

[[ports.capture]]
id = "input34"
name = "Input 3/4"
channels = [2, 3]

[[ports.capture]]
id = "input56"
name = "Input 5/6"
channels = [4, 5]

[[ports.capture]]
id = "input78"
name = "Input 7/8"
channels = [6, 7]

[[ports.capture]]
id = "input910"
name = "Input 9/10"
channels = [8, 9]
