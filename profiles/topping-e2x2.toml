[device]
name = "Topping E2x2 OTG"
rate = 48000
period_size = 64
# ALSA transport keys below are ignored by the Sycon backend; they keep this
# profile valid when switching backend back to "alsa".
hardware_period_size = 64
buffer_size = 256
playback_queue_periods = 2
shared_buffer_size = 512
playback_timer_scheduling = false
duplex_link = true
pro_latency_periods = 0
# Safe mode: 2.0 ms handoff headroom absorbs isolated DSP spikes at Q64
# (~7.2 ms RTL). Set pro_handoff_auto = true for minimum latency (1.25 ms budget).
pro_handoff_us = 2000
pro_handoff_auto = false
# Keep DAW/ASIO callbacks below default kernel threaded IRQ priority (50).
pro_realtime_priority = 46
shared_latency_periods = 5
shared_playback_repeat_on_underrun = false
realtime = true
# USB I/O thread (97); PRO cycle runs at 96; Sycon boosts the device's xHCI IRQ to 98.
realtime_priority = 97
# Sycon mode: sidealsad drives the UAC2 function directly over usbfs and
# detaches snd-usb-audio while it runs (the ALSA card disappears).
# Set backend = "alsa" to use the kernel ALSA driver instead.
backend = "sycon"

[device.sycon]
vendor_id = 0x152a
product_id = 0x8756
# One packet is one 125 us microframe; an OUT URB adds this much latency.
packets_per_urb = 1
playback_urbs = 12
capture_urbs = 16

[device.playback]
device = "hw:OTG,0"
channels = 8
format = "S32_LE"

[device.capture]
device = "hw:OTG,0"
channels = 10
format = "S32_LE"

[[ports.playback]]
id = "line1"
name = "Line 1"
channels = [0, 1]

[[ports.playback]]
id = "line2"
name = "Line 2"
channels = [2, 3]

[[ports.playback]]
id = "line3"
name = "Line 3"
channels = [4, 5]

[[ports.playback]]
id = "line4"
name = "Line 4"
channels = [6, 7]

[[ports.capture]]
id = "mic1"
name = "Mic 1"
channels = [0]

[[ports.capture]]
id = "mic2"
name = "Mic 2"
channels = [1]

[[ports.capture]]
id = "input34"
name = "Input 3/4"
channels = [2, 3]

[[ports.capture]]
id = "input56"
name = "Input 5/6"
channels = [4, 5]

[[ports.capture]]
id = "input78"
name = "Input 7/8"
channels = [6, 7]

[[ports.capture]]
id = "input910"
name = "Input 9/10"
channels = [8, 9]
